<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>𓆩 𝑽𝑬𝑵𝑶𝑴 𝑺𝑻𝑶𝑹𝑬 𓆪 | متجر رشق وخدمات سوشيال ميديا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0d; --bg2:#101015; --card:#15151c; --card2:#1c1c26;
  --line:#2a2a38; --txt:#f2f2f7; --mut:#8f8fa8;
  --red:#ff2e4d; --red2:#d90429; --red3:#ef233c; --darkred:#8b0a1a;
  --grad:linear-gradient(135deg,#ff2e4d,#d90429);
  --grad2:linear-gradient(135deg,#8b0a1a,#ff2e4d);
  --shadow:0 8px 30px rgba(255,46,77,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--txt);
  min-height:100vh;overflow-x:hidden;position:relative;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(600px 400px at 85% -5%, rgba(217,4,41,.18), transparent 60%),
    radial-gradient(700px 500px at 5% 10%, rgba(255,46,77,.08), transparent 60%),
    radial-gradient(500px 500px at 50% 110%, rgba(139,10,26,.12), transparent 60%);
}
#app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh}

/* ===== Header ===== */
header{
  position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);
  background:rgba(10,10,13,.85);border-bottom:1px solid var(--line);
}
.nav-inner{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{
  font-weight:800;font-size:18px;cursor:pointer;white-space:nowrap;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 26px rgba(255,46,77,.4);
}
nav{display:flex;gap:5px;flex-wrap:wrap;margin-inline-start:auto;align-items:center}
nav button{
  background:transparent;border:1px solid transparent;color:var(--mut);font-family:inherit;
  font-size:13.5px;font-weight:700;padding:8px 13px;border-radius:10px;cursor:pointer;transition:.2s;
}
nav button:hover{color:var(--txt);background:#ffffff08}
nav button.active{color:#fff;background:var(--grad);box-shadow:var(--shadow)}
.user-badge{
  display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);
  padding:6px 11px;border-radius:20px;font-size:12.5px;color:var(--mut)
}
.user-badge b{color:var(--red)}

/* ===== Layout ===== */
main{max-width:1180px;margin:0 auto;padding:26px 16px 60px;width:100%;flex:1}
footer{border-top:1px solid var(--line);padding:22px 16px;text-align:center;color:var(--mut);font-size:13px}

h1,h2,h3{line-height:1.35}
.sec-title{font-size:22px;font-weight:800;margin-bottom:6px}
.sec-sub{color:var(--mut);font-size:14px;margin-bottom:18px}

/* ===== Buttons ===== */
.btn{
  font-family:inherit;font-weight:700;font-size:14px;padding:11px 20px;border-radius:12px;
  border:1px solid var(--line);background:var(--card2);color:var(--txt);cursor:pointer;transition:.18s;
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
}
.btn:hover{border-color:#3a3a4e;transform:translateY(-1px)}
.btn-primary{background:var(--grad);color:#fff;border:none;box-shadow:var(--shadow)}
.btn-primary:hover{box-shadow:0 10px 34px rgba(255,46,77,.45)}
.btn-danger{background:#2a0e15;border-color:#5c1b28;color:#ff8fa3}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.btn-block{width:100%}

/* ===== Cards ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}

/* ===== Hero ===== */
.hero{
  border:1px solid var(--line);border-radius:22px;padding:36px 24px;text-align:center;
  background:linear-gradient(160deg,#141419,#0a0a0d);position:relative;overflow:hidden;margin-bottom:26px;
}
.hero::after{
  content:'';position:absolute;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,46,77,.18),transparent 65%);
  top:-160px;left:-100px;filter:blur(6px);
}
.hero h1{font-size:clamp(24px,5vw,40px);font-weight:800;margin-bottom:10px;position:relative}
.hero h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);max-width:620px;margin:0 auto 22px;font-size:15px;line-height:1.9;position:relative}
.hero .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;position:relative}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:26px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
.stat b{display:block;font-size:22px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{color:var(--mut);font-size:12.5px}

/* ===== Service card ===== */
.svc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:.2s;position:relative;overflow:hidden}
.svc:hover{border-color:rgba(255,46,77,.5);transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.5)}
.svc .top{display:flex;align-items:center;gap:10px}
.svc .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:#ffffff08;border:1px solid var(--line);flex-shrink:0}
.svc .nm{font-weight:700;font-size:14.5px;line-height:1.4}
.svc .plat{font-size:11.5px;color:var(--mut)}
.svc .price{font-size:19px;font-weight:800;color:var(--red)}
.svc .price small{font-size:11.5px;color:var(--mut);font-weight:500}
.svc .meta{font-size:12px;color:var(--mut);display:flex;gap:10px;flex-wrap:wrap}

/* ===== Forms ===== */
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--mut);margin-bottom:6px}
.field label b{color:var(--red)}
input,select,textarea{
  width:100%;font-family:inherit;font-size:14px;padding:11px 13px;border-radius:11px;
  background:#0d0d12;border:1px solid var(--line);color:var(--txt);outline:none;transition:.18s;
}
input:focus,select:focus,textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,46,77,.12)}
textarea{resize:vertical;min-height:80px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
.hint{font-size:12px;color:var(--mut);margin-top:5px;line-height:1.7}

/* ===== Payment box ===== */
.pay-box{background:#0d0d12;border:1px dashed var(--line);border-radius:12px;padding:13px;margin-bottom:10px}
.pay-box .pn{font-weight:800;color:var(--red);font-size:14.5px}
.pay-box .num{font-family:monospace;font-size:19px;letter-spacing:1px;direction:ltr;text-align:right;word-break:break-all;color:#fff}
.pay-box .nt{font-size:12px;color:var(--mut);margin-top:4px}

/* ===== Table ===== */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
th{background:#12121a;color:var(--mut);font-weight:700;padding:11px 10px;text-align:right;white-space:nowrap;font-size:12.5px}
td{padding:11px 10px;border-top:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#ffffff04}
.badge{padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;display:inline-block}
.b-pend{background:#3a1015;color:#ff8fa3}
.b-prog{background:#3a2410;color:#ffb454}
.b-done{background:#0c2e17;color:#4ade80}
.b-cancel{background:#2e0c15;color:#ff6b81}

/* ===== Modal ===== */
.modal{position:fixed;inset:0;z-index:200;background:rgba(5,5,8,.85);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.modal.open{display:flex}
.modal-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;
  width:100%;max-width:520px;position:relative;animation:pop .2s ease;margin:auto}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal-card .x{position:absolute;top:12px;left:12px;background:#ffffff0a;border:1px solid var(--line);
  color:var(--mut);width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:17px;line-height:1}
.modal-card h3{margin-bottom:14px;font-size:18px;padding-left:36px}

/* ===== Toast ===== */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);z-index:300;
  background:var(--card);border:1px solid var(--line);border-right:4px solid var(--red);
  padding:13px 20px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.3s;pointer-events:none;
  max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{border-right-color:#ff8fa3}

/* ===== Admin tabs ===== */
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{font-family:inherit;font-weight:700;font-size:13.5px;padding:9px 16px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);color:var(--mut);cursor:pointer;transition:.18s}
.tabs button.active{background:var(--grad);color:#fff;border-color:transparent}
.admin-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto auto;gap:8px;align-items:center;
  padding:10px;border-bottom:1px solid var(--line)}
@media(max-width:820px){.admin-row{grid-template-columns:1fr 1fr;}}
.admin-row input{padding:8px 10px;font-size:13px}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);white-space:nowrap}
.chk input{width:auto}
.empty{text-align:center;color:var(--mut);padding:36px 16px;font-size:14px}
.pill{display:inline-block;background:#ffffff08;border:1px solid var(--line);padding:4px 11px;
  border-radius:20px;font-size:12px;color:var(--mut);margin:0 4px 4px 0}
a{color:var(--red);text-decoration:none}
a:hover{text-decoration:underline}

/* ===== Auth ===== */
.auth-wrap{max-width:440px;margin:30px auto}
.auth-tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:18px}
.auth-tabs button{flex:1;font-family:inherit;font-weight:700;font-size:14px;padding:11px;border:none;
  background:transparent;color:var(--mut);cursor:pointer;border-radius:10px;transition:.2s}
.auth-tabs button.active{background:var(--grad);color:#fff;box-shadow:var(--shadow)}

/* ===== User balance card ===== */
.bal-card{
  background:linear-gradient(135deg,#1a0a10,#0a0a0d);border:1px solid #3a1520;border-radius:18px;
  padding:20px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;
  flex-wrap:wrap;gap:12px;position:relative;overflow:hidden;
}
.bal-card::after{content:'';position:absolute;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,46,77,.2),transparent 70%);top:-90px;left:-50px}
.bal-card .info{position:relative}
.bal-card .info span{color:var(--mut);font-size:13px}
.bal-card .info b{display:block;font-size:28px;color:var(--red);font-weight:800;margin-top:2px}
.bal-card .acts{display:flex;gap:8px;position:relative;flex-wrap:wrap}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="nav-inner">
      <div class="logo" onclick="go('home')">𓆩 𝑽𝑬𝑵𝑶𝑴 𝑺𝑻𝑶𝑹𝑬 𓆪</div>
      <nav id="nav"></nav>
    </div>
  </header>
  <main id="main"></main>
  <footer>
    𓆩 𝑽𝑬𝑵𝑶𝑴 𝑺𝑻𝑶𝑹𝑬 𓆪 &copy; <span id="yr"></span> — جميع الحقوق محفوظة
  </footer>
</div>
<div class="modal" id="modal"></div>
<div id="toast"></div>

<script>
/* =========================================================
   VENOM STORE — Red Edition
   Auth + Wallet + Libyana top-up + Admin panel
   ========================================================= */

/* ---------- Storage ---------- */
const K = p => 'venom_' + p;
const DB = {
  get(k, d){ try{ const v = localStorage.getItem(K(k)); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ localStorage.setItem(K(k), JSON.stringify(v)); },
  del(k){ localStorage.removeItem(K(k)); }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => (Number(n)||0).toLocaleString('en-US') + ' د.ل';

/* ---------- Settings ---------- */
const DEFAULT_SETTINGS = {
  password  : 'venom123',           // كلمة مرور لوحة التحكم
  libyana   : '0912345678',         // ✏️ حط رقم ليبيانا تاعك هنا
  ownerName : 'VENOM STORE'
};

const PLATFORMS = ['انستقرام','تيك توك','فيسبوك','يوتيوب','تيليجرام','واتساب','سناب شات','تويتر','أخرى'];

const DEFAULT_SERVICES = [
  { id:'s1',  name:'متابعين انستقرام عرب',   platform:'انستقرام', icon:'📸', price:12, min:100, max:50000, active:true },
  { id:'s2',  name:'لايكات انستقرام',        platform:'انستقرام', icon:'❤️', price:4,  min:100, max:100000,active:true },
  { id:'s3',  name:'مشاهدات ستوري انستقرام', platform:'انستقرام', icon:'👁️', price:3,  min:500, max:200000,active:true },
  { id:'s4',  name:'متابعين تيك توك',        platform:'تيك توك',  icon:'🎵', price:15, min:100, max:50000, active:true },
  { id:'s5',  name:'لايكات تيك توك',         platform:'تيك توك',  icon:'💗', price:5,  min:100, max:100000,active:true },
  { id:'s6',  name:'مشاهدات تيك توك',        platform:'تيك توك',  icon:'▶️', price:2,  min:1000,max:500000,active:true },
  { id:'s7',  name:'متابعين فيسبوك',         platform:'فيسبوك',   icon:'👍', price:14, min:100, max:50000, active:true },
  { id:'s8',  name:'مشاهدات فيديو فيسبوك',   platform:'فيسبوك',   icon:'🎬', price:3,  min:500, max:300000,active:true },
  { id:'s9',  name:'مشتركين يوتيوب',         platform:'يوتيوب',   icon:'🔴', price:45, min:50,  max:10000, active:true },
  { id:'s10', name:'مشاهدات يوتيوب',         platform:'يوتيوب',   icon:'📺', price:8,  min:500, max:200000,active:true },
  { id:'s11', name:'أعضاء قناة تيليجرام',    platform:'تيليجرام', icon:'✈️', price:10, min:100, max:50000, active:true },
  { id:'s12', name:'أعضاء قروب واتساب',      platform:'واتساب',   icon:'💬', price:20, min:50,  max:5000,  active:true }
];

/* ---------- Init ---------- */
function init(){
  if(!localStorage.getItem(K('services'))) DB.set('services', DEFAULT_SERVICES);
  if(!localStorage.getItem(K('settings'))) DB.set('settings', DEFAULT_SETTINGS);
  if(!localStorage.getItem(K('orders')))   DB.set('orders', []);
  if(!localStorage.getItem(K('topups')))   DB.set('topups', []);
  if(!localStorage.getItem(K('users')))    DB.set('users', {});
}
init();

const getServices = () => DB.get('services', DEFAULT_SERVICES);
const setServices = v => DB.set('services', v);
const getOrders   = () => DB.get('orders', []);
const setOrders   = v => DB.set('orders', v);
const getTopups   = () => DB.get('topups', []);
const setTopups   = v => DB.set('topups', v);
const getUsers    = () => DB.get('users', {});
const setUsers    = v => DB.set('users', v);
const getSettings = () => Object.assign({}, DEFAULT_SETTINGS, DB.get('settings', {}));
const setSettings = v => DB.set('settings', v);

/* ---------- Session ---------- */
function currentUser(){ return DB.get('session', null); }
function setSession(u){ if(u) DB.set('session', u); else DB.del('session'); }

/* ---------- UI helpers ---------- */
let toastTimer;
function toast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = '', 2800);
}
function openModal(html){
  const m = document.getElementById('modal');
  m.innerHTML = '<div class="modal-card">' + html + '</div>';
  m.classList.add('open');
  m.onclick = e => { if(e.target === m) closeModal(); };
}
function closeModal(){ const m = document.getElementById('modal'); m.classList.remove('open'); m.innerHTML = ''; }
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

function statusBadge(s){
  const map = { 'قيد الانتظار':'b-pend','قيد التنفيذ':'b-prog','مكتمل':'b-done','ملغي':'b-cancel','مرفوض':'b-cancel','مقبول':'b-done' };
  return '<span class="badge ' + (map[s] || 'b-pend') + '">' + esc(s) + '</span>';
}
function newId(prefix){ return prefix + Date.now().toString().slice(-6) + Math.floor(Math.random()*90+10); }
function copyText(txt, msg){
  navigator.clipboard.writeText(txt).then(() => toast(msg || 'تم النسخ ✅'))
    .catch(() => toast('تعذر النسخ', true));
}

/* ---------- Auth helpers ---------- */
function hashPass(p){ // hash بسيط جداً (مش آمن للإنتاج الحقيقي، فقط للعرض)
  let h = 0;
  for(let i=0;i<p.length;i++){ h = ((h << 5) - h + p.charCodeAt(i)) | 0; }
  return 'h' + h.toString(36) + '_' + p.length;
}
function validateEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }
function validatePhone(p){ return /^09[0-9]{8}$/.test(p); }

/* ---------- Router ---------- */
let current = 'home';
let isAdmin = sessionStorage.getItem('venom_admin') === '1';
let adminTab = 'orders';

function go(r){
  current = r;
  if(r !== 'admin') adminTab = 'orders';
  render();
  window.scrollTo({ top:0, behavior:'smooth' });
}

/* ---------- Nav render ---------- */
function renderNav(){
  const u = currentUser();
  const nav = document.getElementById('nav');
  if(!u){
    nav.innerHTML = `
      <button data-r="home" class="${current==='home'?'active':''}" onclick="go('home')">الرئيسية</button>
      <button data-r="login" class="${current==='login'?'active':''}" onclick="go('login')">دخول / تسجيل</button>
    `;
  } else {
    nav.innerHTML = `
      <button data-r="home" class="${current==='home'?'active':''}" onclick="go('home')">الرئيسية</button>
      <button data-r="services" class="${current==='services'?'active':''}" onclick="go('services')">الخدمات</button>
      <button data-r="wallet" class="${current==='wallet'?'active':''}" onclick="go('wallet')">شحن الرصيد</button>
      <button data-r="orders" class="${current==='orders'?'active':''}" onclick="go('orders')">طلباتي</button>
      <button data-r="admin" class="${current==='admin'?'active':''}" onclick="go('admin')">لوحة التحكم</button>
      <div class="user-badge">
        👤 <b>${esc(u.username)}</b>
        <span style="color:var(--line)">|</span>
        ${money(u.balance || 0)}
        <button class="btn btn-sm" style="padding:4px 9px;font-size:11.5px" onclick="logout()">خروج</button>
      </div>
    `;
  }
}

function logout(){
  setSession(null);
  isAdmin = false;
  sessionStorage.removeItem('venom_admin');
  toast('تم تسجيل الخروج');
  go('home');
}

/* ---------- Render ---------- */
function render(){
  document.getElementById('yr').textContent = new Date().getFullYear();
  renderNav();

  const u = currentUser();
  // حماية الصفحات
  if(!u && !['home','login','admin'].includes(current)){ current = 'login'; }

  const views = { home, services, wallet, orders, login, admin };
  document.getElementById('main').innerHTML = (views[current] || home)();
  if(current === 'services') applyFilter();
  if(current === 'admin' && isAdmin) renderAdminTab();
}

/* =========================================================
   LOGIN / REGISTER
   ========================================================= */
let authMode = 'register';

function login(){
  return `
  <div class="auth-wrap">
    <div class="auth-tabs">
      <button class="${authMode==='register'?'active':''}" onclick="setAuth('register')">📝 تسجيل جديد</button>
      <button class="${authMode==='login'?'active':''}" onclick="setAuth('login')">🔑 دخول</button>
    </div>

    <div class="card">
      ${authMode === 'register' ? registerForm() : loginForm()}
    </div>

    <div class="hint" style="text-align:center;margin-top:14px">
      🔒 بياناتك محفوظة على جهازك فقط (localStorage)
    </div>
  </div>`;
}

function registerForm(){
  return `
    <h2 class="sec-title" style="text-align:center;margin-bottom:4px">إنشاء حساب جديد</h2>

function setAuth(m){ authMode = m; render(); }

function doRegister(){
  const username = document.getElementById('rUser').value.trim();
  const email    = document.getElementById('rEmail').value.trim().toLowerCase();
  const phone    = document.getElementById('rPhone').value.trim();
  const pass     = document.getElementById('rPass').value;
  const pass2    = document.getElementById('rPass2').value;

  if(username.length < 3)  return toast('اسم المستخدم قصير جداً', true);
  if(!validateEmail(email)) return toast('البريد الإلكتروني غير صحيح', true);
  if(!validatePhone(phone)) return toast('رقم الهاتف يجب أن يبدأ بـ 09 ويكون 10 أرقام', true);
  if(pass.length < 6)      return toast('كلمة المرور 6 أحرف على الأقل', true);
  if(pass !== pass2)       return toast('كلمتا المرور غير متطابقتين', true);

  const users = getUsers();
  if(Object.values(users).some(u => u.email === email))
    return toast('البريد الإلكتروني مسجل مسبقاً', true);
  if(Object.values(users).some(u => u.phone === phone))
    return toast('رقم الهاتف مسجل مسبقاً', true);
  if(Object.values(users).some(u => u.username.toLowerCase() === username.toLowerCase()))
    return toast('اسم المستخدم محجوز', true);

  const uid = newId('U');
  users[uid] = {
    id: uid, username, email, phone,
    pass: hashPass(pass),
    balance: 0,
    created: new Date().toISOString()
  };
  setUsers(users);
  setSession({ id: uid, username, email, phone, balance: 0 });

  toast('تم إنشاء حسابك بنجاح 🎉');
  go('home');
}

function doLogin(){
  const email = document.getElementById('lEmail').value.trim().toLowerCase();
  const pass  = document.getElementById('lPass').value;

  if(!email || !pass) return toast('أدخل البريد و كلمة المرور', true);

  const users = getUsers();
  const u = Object.values(users).find(x => x.email === email);
  if(!u) return toast('لا يوجد حساب بهذا البريد', true);
  if(u.pass !== hashPass(pass)) return toast('كلمة المرور غير صحيحة', true);

  setSession({ id: u.id, username: u.username, email: u.email, phone: u.phone, balance: u.balance || 0 });
  toast('مرحباً ' + u.username + ' 👋');
  go('home');
}

  const s = currentUser();

  const u = getUsers()[s.id];
  if(u) setSession({ id: u.id, username: u.username, email: u.email, phone: u.phone, balance: u.balance || 0 });
}

function services(){

  return `

      </div>
      <div class="field" style="margin:0">
        <label>📱 المنصة</label>
        <select id="platSelect" onchange="filterPlat=this.value;applyFilter()">
          ${plats.map(p => `<option ${p===filterPlat?'selected':''}>${esc(p)}</option>`).join('')}
        </select>
      </div>
    </div>
  </div>

  <div class="grid" id="svcGrid"></div>

function applyFilter(){
  const grid = document.getElementById('svcGrid');
  if(!grid) return;
  const q = searchQ.trim().toLowerCase();
  const list = getServices().filter(s =>
    s.active &&
    (filterPlat === 'الكل' || s.platform === filterPlat) &&
    (!q || s.name.toLowerCase().includes(q) || s.platform.toLowerCase().includes(q))
  );
  grid.innerHTML = list.length
    ? list.map(svcCard).join('')
    : '<div class="empty">لا توجد نتائج مطابقة 🔍</div>';
}

function calcCost(id){
  const s = getServices().find(x => x.id === id);
  const q = Number(document.getElementById('oQty').value) || 0;
  const cost = Math.ceil(((q / 1000) * Number(s.price)) * 100) / 100;
  document.getElementById('oCost').value = money(cost);
  return cost;
}

function submitOrder(svcId){
  const u = currentUser();
  if(!u) return go('login');
  const s = getServices().find(x => x.id === svcId);
  const link = document.getElementById('oLink').value.trim();
  const qty  = Number(document.getElementById('oQty').value);
  const note = document.getElementById('oNote').value.trim();

  if(!link) return toast('أدخل الرابط', true);
  if(!qty || qty < s.min || qty > s.max)
    return toast(`الكمية يجب أن تكون بين ${s.min} و ${s.max}`, true);

  const cost = Math.ceil(((qty / 1000) * Number(s.price)) * 100) / 100;

  const users = getUsers();
  const me = users[u.id];
  if(!me) return toast('الحساب غير موجود', true);
  if((me.balance || 0) < cost)
    return toast('رصيدك غير كافٍ — اشحن رصيدك أولاً', true);

  me.balance = Math.round((me.balance - cost) * 100) / 100;
  setUsers(users);
  refreshSession();

  const order = {
    id: newId('VS'),
    userId: u.id,
    username: u.username,
    phone: u.phone,
    serviceId: s.id,
    service: s.name,
    platform: s.platform,
    link, qty, cost, note,
    status: 'قيد الانتظار',
    date: new Date().toISOString()
  };
  const orders = getOrders();
  orders.unshift(order);
  setOrders(orders);

  closeModal();
  openModal(`
    <button class="x" onclick="closeModal()">✕</button>
    <h3>✅ تم استلام طلبك</h3>
    <div class="pay-box" style="border-style:solid">
      <div class="pn">رقم الطلب: ${esc(order.id)}</div>
      <div class="nt">احتفظ بالرقم لمتابعة الطلب</div>
    </div>
    <div style="font-size:13.5px;line-height:2.1;color:var(--mut)">
      <div>🔗 الرابط: <span dir="ltr" style="color:var(--txt);word-break:break-all">${esc(link)}</span></div>
      <div>🔢 الكمية: <b style="color:var(--txt)">${qty.toLocaleString()}</b></div>
      <div>💰 التكلفة: <b style="color:var(--red)">${money(cost)}</b></div>
      <div>💼 الرصيد الجديد: <b style="color:var(--txt)">${money(me.balance)}</b></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
      <button class="btn btn-sm" onclick="copyText('${order.id}','تم نسخ رقم الطلب ✅')">📋 نسخ رقم الطلب</button>
      <button class="btn btn-primary btn-sm" onclick="closeModal();go('orders')">📦 طلباتي</button>
    </div>
  `);
  toast('تم إرسال الطلب بنجاح 🐍');
  render();
}

    <div class="stat"><b>${orders.length}</b><span>إجمالي الطلبات</span></div>
    <div class="stat"><b>${pendingO}</b><span>طلبات جديدة</span></div>
    <div class="stat"><b>${pendingT}</b><span>شحن بانتظار التأكيد</span></div>
    <div class="stat"><b>${money(revenue)}</b><span>إجمالي المبيعات</span></div>
  </div>

  <div class="tabs">
    <button class="${adminTab==='orders'?'active':''}" onclick="setTab('orders')">📦 الطلبات ${pendingO?'('+pendingO+')':''}</button>
    <button class="${adminTab==='topups'?'active':''}" onclick="setTab('topups')">💳 شحن الرصيد ${pendingT?'('+pendingT+')':''}</button>
    <button class="${adminTab==='services'?'active':''}" onclick="setTab('services')">🛍️ الخدمات والأسعار</button>
    <button class="${adminTab==='users'?'active':''}" onclick="setTab('users')">👥 المستخدمين (${Object.keys(users).length})</button>

  </div>

  <div id="adminBody"></div>
  `;
}

function setTab(t){ adminTab = t; render(); }

function renderAdminTab(){
  const body = document.getElementById('adminBody');
  if(!body) return;
  const fn = { orders: tabOrders, topups: tabTopups, services: tabServices, users: tabUsers, settings: tabSettings };
  body.innerHTML = (fn[adminTab] || tabOrders)();
}

function adminLogin(){
  const p = document.getElementById('admPass').value;
  if(p === getSettings().password){
    isAdmin = true;
    sessionStorage.setItem('venom_admin', '1');
    toast('مرحباً بك في لوحة التحكم 🐍');
    render();
  } else toast('كلمة المرور غير صحيحة', true);
}
function adminLogout(){
  isAdmin = false;
  sessionStorage.removeItem('venom_admin');
  render();
}

          ${['قيد الانتظار','قيد التنفيذ','مكتمل','ملغي'].map(s =>
            `<option ${o.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
        <div style="margin-top:5px">${statusBadge(o.status)}</div>
      </td>
      <td>
        <div style="display:flex;flex-direction:column;gap:5px">
          <button class="btn btn-sm" onclick="copyOrder('${o.id}')">📋 نسخ</button>
          <button class="btn btn-sm btn-danger" onclick="delOrder('${o.id}')">🗑️</button>
        </div>

    </tr>`).join('')}</tbody>

function setOrderStatus(id, st){
  const orders = getOrders();
  const o = orders.find(x => x.id === id);
  if(!o) return;
  o.status = st;
  setOrders(orders);
  toast('تم تحديث حالة الطلب ✅');
  render();
}
function delOrder(id){
  if(!confirm('تأكيد حذف الطلب؟')) return;
  setOrders(getOrders().filter(o => o.id !== id));
  toast('تم حذف الطلب');
  render();
}
function copyOrder(id){
  const o = getOrders().find(x => x.id === id);
  if(!o) return;
  const txt =
`🐍 طلب — VENOM STORE
🆔 ${o.id}
👤 ${o.username||'-'}
🛍️ ${o.service} (${o.platform||''})
🔗 ${o.link}
🔢 ${Number(o.qty).toLocaleString()}
💰 ${money(o.cost)}
📞 ${o.phone||'-'}
📌 ${o.status}`;
  copyText(txt, 'تم نسخ التفاصيل ✅');
}

/* ---------- Admin: Top-ups ---------- */
function tabTopups(){
  const t = getTopups();
  if(!t.length) return '<div class="empty">لا توجد طلبات شحن 📭</div>';
  return `<div class="tbl-wrap"><table>
    <thead><tr>
      <th>رقم</th><th>المستخدم</th><th>من رقم</th><th>المبلغ</th>
      <th>رقم العملية</th><th>التاريخ</th><th>الحالة</th><th>إجراءات</th>
    </tr></thead>
    <tbody>${t.map(x => `<tr>
      <td><b>${esc(x.id)}</b></td>
      <td>${esc(x.username||'-')}</td>
      <td dir="ltr">${esc(x.from)}</td>
      <td style="color:var(--red);font-weight:700">${money(x.amount)}</td>
      <td dir="ltr" style="font-size:12px">${esc(x.ref)}</td>
      <td style="font-size:12px;color:var(--mut)">${new Date(x.date).toLocaleString('ar-LY')}</td>
      <td>${statusBadge(x.status)}</td>
      <td>
        ${x.status === 'قيد الانتظار' ? `
          <div style="display:flex;gap:5px">
            <button class="btn btn-sm btn-primary" onclick="approveTopup('${x.id}')">✅ قبول</button>
            <button class="btn btn-sm btn-danger" onclick="rejectTopup('${x.id}')">❌ رفض</button>
          </div>` :
          '<button class="btn btn-sm btn-danger" onclick="delTopup(\'' + x.id + '\')">🗑️ حذف</button>'}
      </td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

function approveTopup(id){
  const list = getTopups();
  const t = list.find(x => x.id === id);
  if(!t || t.status !== 'قيد الانتظار') return;

  const users = getUsers();
  const u = users[t.userId];
  if(!u) return toast('المستخدم غير موجود', true);

  u.balance = Math.round(((u.balance || 0) + Number(t.amount)) * 100) / 100;
  setUsers(users);

  t.status = 'مقبول';
  setTopups(list);

  if(currentUser() && currentUser().id === t.userId) refreshSession();
  toast('تم قبول الشحن وإضافة الرصيد ✅');
  render();
}
function rejectTopup(id){
  const list = getTopups();
  const t = list.find(x => x.id === id);
  if(!t) return;
  t.status = 'مرفوض';
  setTopups(list);
  toast('تم رفض طلب الشحن');
  render();
}
function delTopup(id){
  if(!confirm('حذف الطلب؟')) return;
  setTopups(getTopups().filter(x => x.id !== id));
  render();
}

    <p class="sec-sub" style="margin:0">عدّل الأسعار والكميات — الحفظ تلقائي ⚡</p>
    <button class="btn btn-primary btn-sm" onclick="addService()">➕ إضافة خدمة</button>
  </div>

      <div>اسم الخدمة</div><div>المنصة</div><div>السعر/1000</div>
      <div>أدنى</div><div>أقصى</div><div>مفعّل / حذف</div>
    </div>
    ${list.length ? list.map(s => `
      <div class="admin-row">
        <input value="${esc(s.name)}" onchange="updService('${s.id}','name',this.value)">

        </select>
        <input type="number" step="0.5" value="${s.price}" onchange="updService('${s.id}','price',this.value)">
        <input type="number" value="${s.min}" onchange="updService('${s.id}','min',this.value)">
        <input type="number" value="${s.max}" onchange="updService('${s.id}','max',this.value)">
        <div style="display:flex;gap:8px;align-items:center">
          <label class="chk"><input type="checkbox" ${s.active?'checked':''} onchange="updService('${s.id}','active',this.checked)"> مفعّل</label>
          <button class="btn btn-sm btn-danger" onclick="delService('${s.id}')">🗑️</button>
        </div>
      </div>`).join('') : '<div class="empty">لا توجد خدمات — أضف خدمة جديدة</div>'}
  </div>`;
}

function updService(id, key, val){
  const list = getServices();
  const s = list.find(x => x.id === id);
  if(!s) return;
  if(['price','min','max'].includes(key)) val = Number(val) || 0;
  s[key] = val;
  setServices(list);
  toast('تم الحفظ ✅');
}

  const list = getServices();
  list.push({
    id: 's' + Date.now(
